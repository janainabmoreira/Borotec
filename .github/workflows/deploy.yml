name: Build and Deploy (FTP)

# Runs automatically on every push to main (code changes), and can also be
# triggered manually from the Actions tab — use the manual trigger after
# adding/editing a product or blog post in /admin, since those are saved
# straight to Supabase and need a rebuild to get prerendered into the live
# static site (the build step below runs `npm run build`, which fetches the
# current catalog from Supabase and prerenders every page — see
# scripts/prerender.mjs).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # scripts/buildRoutes.mjs imports src/data/blog.ts directly, relying
          # on Node's native TypeScript support — only enabled by default from
          # 23.6+ (22.x needs --experimental-strip-types). Pin to what was
          # actually tested locally (24) rather than the minimum that happens
          # to work, so a future Node LTS bump doesn't silently break this.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (vite build + prerender)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Normalize FTP server-dir
        id: ftp-dir
        # FTP-Deploy-Action requires a trailing slash — compute it here so the
        # FTP_SERVER_DIR secret doesn't need to be typed exactly right.
        run: |
          DIR="${{ secrets.FTP_SERVER_DIR }}"
          [[ "$DIR" != */ ]] && DIR="${DIR}/"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Deploy dist/ via FTP (lftp)
        # SamKirkland/FTP-Deploy-Action consistently failed with
        # "550 assets: No such file or directory" against this host across
        # several configurations (absolute/relative server-dir, with and
        # without a pre-existing assets/ folder) — a known, unresolved issue
        # in that action (see its GitHub issues for "550"). lftp is the
        # underlying tool most FTP deploy actions wrap anyway; talking to it
        # directly avoids whatever that wrapper does differently, and its
        # --verbose output actually shows the FTP commands/responses if this
        # still needs debugging.
        #
        # Intentionally NOT using --delete on mirror: this only creates/
        # updates files, it never removes anything already on the server, so
        # unrelated content there (e.g. old_site/) is untouched. Means old
        # cache-busted JS/CSS from previous builds will accumulate in
        # assets/ over time — fine for now, worth revisiting later.
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ steps.ftp-dir.outputs.dir }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -e "
            set ftp:ssl-allow no;
            set ftp:passive-mode true;
            set net:timeout 20;
            set net:max-retries 3;
            set mirror:parallel-transfer-count 2;
            open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" ftp://$FTP_SERVER;
            mirror --reverse --verbose ./dist/ \"$FTP_DIR\";
            quit;
          "
