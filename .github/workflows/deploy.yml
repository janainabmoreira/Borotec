name: Build and Deploy (FTP)

# Runs automatically on every push to main (code changes), and can also be
# triggered manually from the Actions tab — use the manual trigger after
# adding/editing a product or blog post in /admin, since those are saved
# straight to Supabase and need a rebuild to get prerendered into the live
# static site (the build step below runs `npm run build`, which fetches the
# current catalog from Supabase and prerenders every page — see
# scripts/prerender.mjs).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # scripts/buildRoutes.mjs imports src/data/blog.ts directly, relying
          # on Node's native TypeScript support — only enabled by default from
          # 23.6+ (22.x needs --experimental-strip-types). Pin to what was
          # actually tested locally (24) rather than the minimum that happens
          # to work, so a future Node LTS bump doesn't silently break this.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (vite build + prerender)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Normalize FTP server-dir
        id: ftp-dir
        # FTP-Deploy-Action requires a trailing slash — compute it here so the
        # FTP_SERVER_DIR secret doesn't need to be typed exactly right.
        run: |
          DIR="${{ secrets.FTP_SERVER_DIR }}"
          [[ "$DIR" != */ ]] && DIR="${DIR}/"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Deploy dist/ via FTP (curl)
        # History: SamKirkland/FTP-Deploy-Action failed with "550 assets: No
        # such file or directory"; lftp hung right after the server's "220 FTP
        # server ready" banner (max-retries exceeded). Uploads go through curl.
        #
        # Connection + target folder: scripts/ftp-base.sh — explicit TLS with
        # the certificate VALIDATED as *.kinghost.net first, --insecure only as
        # fallback, plain FTP last; the variant used is printed as a notice.
        # The site root is confirmed by SIZE/MDTM on index.html, robots.txt
        # and sitemap.xml (this server can't list its current folder), then
        # .deploy-test is written and deleted. Nothing is uploaded otherwise.
        #
        # Only creates/updates files, never deletes anything on the server
        # (old cache-busted assets accumulate in assets/ — fine for now).
        #
        # Upload order matters: .htaccess serves /app-shell.html for every
        # route without its own folder (ErrorDocument 404), so app-shell.html
        # goes up FIRST and .htaccess LAST. --fail-early stops at the first
        # failed transfer, so a failed app-shell.html upload never leaves a
        # new .htaccess behind. curl transfers in binary mode (TYPE I): no
        # line-ending conversion — checked by size right after the upload.
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ steps.ftp-dir.outputs.dir }}
        run: |
          set -euo pipefail
          source scripts/ftp-base.sh
          if ! resolve_ftp_base; then
            echo "::error::Raiz do site não confirmada no FTP (index.html, robots.txt e sitemap.xml via SIZE). Nada foi enviado."
            exit 1
          fi
          ftp_write_test

          BASE="$FTP_BASE"
          AUTH=(--user "$FTP_USERNAME:$FTP_PASSWORD" "${FTP_OPTS[@]}" --connect-timeout 20 --retry 3 --silent --show-error --fail)

          cfg=$(mktemp)
          add() {
            local enc
            enc=$(printf '%s' "$1" | sed 's/%/%25/g; s/ /%20/g; s/#/%23/g')
            printf 'upload-file = "dist/%s"\nurl = "%s%s"\n' "$1" "$BASE" "$enc" >> "$cfg"
          }
          add app-shell.html
          while IFS= read -r f; do add "$f"; done < <(cd dist && find . -type f ! -name .htaccess ! -name app-shell.html | sed 's#^\./##' | sort)
          add .htaccess

          echo "Enviando $(grep -c '^url' "$cfg") arquivos (app-shell.html primeiro, .htaccess por último)..."
          curl "${AUTH[@]}" --ftp-create-dirs --fail-early -K "$cfg"
          echo "Upload concluído."

      - name: Verify upload (sizes, binary mode)
        # Tamanho no servidor (SIZE) = tamanho local para o .htaccess e TODOS os
        # .html. Conversão de fim de linha (modo ASCII) mudaria o tamanho.
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ steps.ftp-dir.outputs.dir }}
        run: |
          set -uo pipefail
          source scripts/ftp-base.sh
          resolve_ftp_base || { echo "::error::Sem conexão para verificar."; exit 1; }
          bad=0; n=0
          while IFS= read -r f; do
            n=$((n + 1))
            local_size=$(stat -c %s "dist/$f")
            enc=$(printf '%s' "$f" | sed 's/%/%25/g; s/ /%20/g; s/#/%23/g')
            remote_size=$(ftp_size "$enc")
            if [ "$local_size" != "$remote_size" ]; then
              bad=$((bad + 1)); echo "DIFERENTE: $f local=$local_size servidor=${remote_size:-?}"
            fi
          done < <(cd dist && { echo .htaccess; echo robots.txt; echo sitemap.xml; find . -name '*.html' | sed 's#^\./##'; } | sort -u)
          echo "Conferidos $n arquivos (.htaccess, robots.txt, sitemap.xml e todos os .html): $((n - bad)) iguais, $bad diferentes."
          [ "$bad" -eq 0 ] || { echo "::error::$bad arquivo(s) com tamanho diferente no servidor."; exit 1; }
          echo "::notice title=Upload verificado::$n arquivos com o mesmo tamanho do build (transferência binária, sem conversão de fim de linha)."
