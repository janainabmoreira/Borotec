name: Build and Deploy (FTP)

# Runs automatically on every push to main (code changes), and can also be
# triggered manually from the Actions tab — use the manual trigger after
# adding/editing a product or blog post in /admin, since those are saved
# straight to Supabase and need a rebuild to get prerendered into the live
# static site (the build step below runs `npm run build`, which fetches the
# current catalog from Supabase and prerenders every page — see
# scripts/prerender.mjs).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # scripts/buildRoutes.mjs imports src/data/blog.ts directly, relying
          # on Node's native TypeScript support — only enabled by default from
          # 23.6+ (22.x needs --experimental-strip-types). Pin to what was
          # actually tested locally (24) rather than the minimum that happens
          # to work, so a future Node LTS bump doesn't silently break this.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (vite build + prerender)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Normalize FTP server-dir
        id: ftp-dir
        # FTP-Deploy-Action requires a trailing slash — compute it here so the
        # FTP_SERVER_DIR secret doesn't need to be typed exactly right.
        run: |
          DIR="${{ secrets.FTP_SERVER_DIR }}"
          [[ "$DIR" != */ ]] && DIR="${DIR}/"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: List orphan folders on server (read-only)
        # Só lista — nunca apaga. Pastas antigas no servidor sem rota no build
        # atual (ver scripts/ftp-orphans.sh). Não bloqueia o deploy.
        continue-on-error: true
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ steps.ftp-dir.outputs.dir }}
        run: bash scripts/ftp-orphans.sh

      - name: Deploy dist/ via FTP (curl)
        # History: SamKirkland/FTP-Deploy-Action failed with "550 assets: No
        # such file or directory"; lftp then hung right after the server's
        # "220 FTP server ready" banner until "max-retries exceeded" (10/11),
        # while plain curl — same runner, same secrets — logs in, lists and
        # transfers fine. So uploads go through curl.
        #
        # Only creates/updates files, never deletes anything on the server
        # (old cache-busted assets accumulate in assets/ — fine for now).
        #
        # Upload order matters: .htaccess rewrites every route without its own
        # folder to /app-shell.html, so app-shell.html goes up FIRST and
        # .htaccess LAST. --fail-early stops at the first failed transfer, so
        # a failed app-shell.html upload never leaves a new .htaccess behind.
        #
        # FTP_DIR is used relative to the FTP login dir (the server denies PWD;
        # "/www/" and "www/" are the same folder there). Safety check: the
        # target must already contain index.html, otherwise abort — so a wrong
        # FTP_SERVER_DIR can't silently create a new folder and "deploy" there.
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ steps.ftp-dir.outputs.dir }}
        run: |
          set -euo pipefail
          BASE="ftp://$FTP_SERVER/${FTP_DIR#/}"
          AUTH=(--user "$FTP_USERNAME:$FTP_PASSWORD" --ftp-pasv --connect-timeout 20 --retry 3 --silent --show-error --fail)

          if ! curl "${AUTH[@]}" --list-only "$BASE" | tr -d '\r' | grep -qx 'index.html'; then
            echo "::error::FTP_SERVER_DIR não parece ser a raiz do site (sem index.html). Nada foi enviado."
            exit 1
          fi

          cfg=$(mktemp)
          add() {
            local enc
            enc=$(printf '%s' "$1" | sed 's/%/%25/g; s/ /%20/g; s/#/%23/g')
            printf 'upload-file = "dist/%s"\nurl = "%s%s"\n' "$1" "$BASE" "$enc" >> "$cfg"
          }
          add app-shell.html
          while IFS= read -r f; do add "$f"; done < <(cd dist && find . -type f ! -name .htaccess ! -name app-shell.html | sed 's#^\./##' | sort)
          add .htaccess

          echo "Enviando $(grep -c '^url' "$cfg") arquivos (app-shell.html primeiro, .htaccess por último)..."
          curl "${AUTH[@]}" --ftp-create-dirs --fail-early -K "$cfg"
          echo "Upload concluído."
