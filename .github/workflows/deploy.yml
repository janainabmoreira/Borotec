name: Build and Deploy (FTP)

# Runs automatically on every push to main (code changes), and can also be
# triggered manually from the Actions tab — use the manual trigger after
# adding/editing a product or blog post in /admin, since those are saved
# straight to Supabase and need a rebuild to get prerendered into the live
# static site (the build step below runs `npm run build`, which fetches the
# current catalog from Supabase and prerenders every page — see
# scripts/prerender.mjs).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # scripts/buildRoutes.mjs imports src/data/blog.ts directly, relying
          # on Node's native TypeScript support — only enabled by default from
          # 23.6+ (22.x needs --experimental-strip-types). Pin to what was
          # actually tested locally (24) rather than the minimum that happens
          # to work, so a future Node LTS bump doesn't silently break this.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (vite build + prerender)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Normalize FTP server-dir
        id: ftp-dir
        # FTP-Deploy-Action requires a trailing slash — compute it here so the
        # FTP_SERVER_DIR secret doesn't need to be typed exactly right.
        run: |
          DIR="${{ secrets.FTP_SERVER_DIR }}"
          [[ "$DIR" != */ ]] && DIR="${DIR}/"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Deploy dist/ via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./dist/
          # Adjust the FTP_SERVER_DIR secret to wherever the site root is on
          # your host (commonly /public_html/ on cPanel — check what folder
          # your current manual FTP uploads go into and match it there).
          server-dir: ${{ steps.ftp-dir.outputs.dir }}
          dangerous-clean-slate: false
